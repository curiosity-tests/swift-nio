name: CMake build

permissions:
  contents: read
  id-token: write

on:
  workflow_call:
    inputs:
      chalk_on:
        description: "racecar: instrumented arm switch, passed down by the caller"
        type: string
        default: "false"
      profile:
        description: "CrashOverride chalk profile"
        type: string
        default: curiosity-tests-racecar
      update_cmake_lists_config:
        type: string
        description: "The configuration used when updating the CMake lists."
        required: true
      cmake_build_target_directory:
        type: string
        description: "The directory to pass to `cmake build`."
        default: "."
      cmake_version:
        type: string
        description: "The version of CMake to install."
        default: ""
      image:
        type: string
        description: "The docker image to run the checks in."
        default: "swift:6.0-jammy"

env:
  # The one variable that separates the arms: on baseline, action-checkout
  # skips its Set up Chalk step entirely.
  CHALK_ON: ${{ inputs.chalk_on }}

jobs:
  cmake-checks:
    name: CMake checks
    runs-on: ubuntu-latest
    container:
      image: ${{ inputs.image }}
    steps:
      - name: Install curl/bash for action-checkout (racecar; ungated, both arms)
        shell: sh
        run: |
          command -v curl >/dev/null 2>&1 && command -v bash >/dev/null 2>&1 && exit 0
          if command -v apt-get >/dev/null 2>&1; then
            apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq curl ca-certificates bash
          elif command -v apk >/dev/null 2>&1; then apk add --no-cache curl ca-certificates bash
          elif command -v dnf >/dev/null 2>&1; then dnf install -y curl ca-certificates bash
          elif command -v yum >/dev/null 2>&1; then yum install -y curl ca-certificates bash
          elif command -v zypper >/dev/null 2>&1; then zypper -n install curl ca-certificates bash
          fi

      - name: Checkout repository
        uses: crashappsec/action-checkout@main
        with:
          chalk: ${{ env.CHALK_ON }}
          profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
          observables_continue_on_error: false
          lfs: false
          persist-credentials: false
          submodules: true
      - name: Assert instrumentation is live
        if: env.CHALK_ON == 'true'
        run: |
          test -n "${CURIOSITY_ROOT:-}" || { echo "::error::CURIOSITY_ROOT unset - observables never installed"; exit 1; }
          test -S "${CURIOSITY_SOCKET_NAME:?socket name unset}" || { echo "::error::co-hostd socket absent"; exit 1; }

      - name: Mark the workspace as safe
        # https://github.com/actions/checkout/issues/766
        run: git config --global --add safe.directory ${GITHUB_WORKSPACE}
      - name: Check CMakeLists files
        run: |
          which curl jq || apt -q update
          which curl || apt -yq install curl
          which jq || apt -yq install jq
          curl -s --retry 3 https://raw.githubusercontent.com/apple/swift-nio/main/scripts/update-cmake-lists.sh | CONFIG_JSON="$INPUT_UPDATE_CMAKE_LISTS_CONFIG" FAIL_ON_CHANGES=true bash
        env:
          INPUT_UPDATE_CMAKE_LISTS_CONFIG: ${{ inputs.update_cmake_lists_config }}
      - name: CMake build
        run: |
          which curl cmake ninja || apt -q update
          which curl || apt -yq install curl
          which cmake || apt -yq install cmake
          which ninja || apt -yq install ninja-build
          curl -s --retry 3 https://raw.githubusercontent.com/apple/swift-nio/main/scripts/cmake-build.sh | TARGET_DIRECTORY="$INPUT_CMAKE_BUILD_TARGET_DIRECTORY" CMAKE_VERSION="$INPUT_CMAKE_VERSION" bash
        env:
          INPUT_CMAKE_BUILD_TARGET_DIRECTORY: ${{ inputs.cmake_build_target_directory }}
          INPUT_CMAKE_VERSION: ${{ inputs.cmake_version }}
